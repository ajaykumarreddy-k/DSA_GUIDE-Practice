[project]
name = "motionsites-scraper"
version = "0.1.0"
description = "Scrape GIFs and prompts from motionsites.ai"
requires-python = ">=3.10"

dependencies = [
    "playwright>=1.44.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
